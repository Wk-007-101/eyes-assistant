<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ตาทิพย์ — ผู้ช่วยบอกสิ่งของรอบตัว</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ชั้นเริ่มต้น กินเต็มจอ แตะตรงไหนก็ได้เพื่อเริ่ม */
  #startLayer {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; padding: 32px; text-align: center;
    background: #0d47a1; cursor: pointer;
  }
  #startLayer h1 { margin: 0; font-size: 40px; }
  #startLayer p  { margin: 0; font-size: 24px; line-height: 1.5; }
  #startLayer .big { font-size: 64px; }

  #tapArea { position: relative; flex: 1; min-height: 0; background: #111; overflow: hidden; }
  #cam, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { pointer-events: none; }
  #hint {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 10px 14px; font-size: 15px;
    background: rgba(0,0,0,.55); text-align: center;
  }

  #status {
    padding: 14px 16px; font-size: 22px; line-height: 1.4;
    background: #ffe600; color: #000; font-weight: 700;
    min-height: 64px; display: flex; align-items: center;
  }
  #list {
    padding: 8px 16px; font-size: 16px; line-height: 1.6;
    background: #141414; max-height: 20vh; overflow-y: auto;
  }
  #list .row { padding: 3px 0; border-bottom: 1px solid #262626; }
  #list .sc { color: #9e9e9e; }

  #controls {
    display: none; background: #000; gap: 2px;
    grid-template-columns: 1fr 1fr;
  }
  button {
    flex: 1; padding: 26px 6px;
    font-size: 20px; font-weight: 700; font-family: inherit;
    color: #fff; background: #1565c0; border: none; cursor: pointer;
  }
  button:active { background: #0d47a1; }
  button.on { background: #2e7d32; }
</style>
</head>
<body>

<!-- ชั้นเริ่มต้น: ทั้งหน้าจอคือปุ่มเริ่ม คนตาบอดไม่ต้องหาปุ่ม -->
<div id="startLayer" role="button" tabindex="0"
     aria-label="แตะที่ใดก็ได้บนหน้าจอเพื่อเริ่มใช้งานตาทิพย์">
  <div class="big" aria-hidden="true">👁</div>
  <h1>ตาทิพย์</h1>
  <p>แตะที่ใดก็ได้<br>บนหน้าจอเพื่อเริ่ม</p>
</div>

<div id="tapArea" role="button" tabindex="0"
     aria-label="พื้นที่กล้อง แตะเพื่อให้บอกสิ่งที่เห็น">
  <video id="cam" playsinline autoplay muted></video>
  <canvas id="overlay" aria-hidden="true"></canvas>
  <div id="hint" aria-hidden="true">แตะที่หน้าจอเพื่อให้บอกสิ่งที่เห็น</div>
</div>

<div id="status" role="status" aria-live="polite" aria-atomic="true">
  แตะที่ใดก็ได้บนหน้าจอเพื่อเริ่ม
</div>
<div id="list" aria-hidden="true">ยังไม่พบสิ่งของ</div>

<div id="controls">
  <button id="btnStop" aria-label="หยุดการทำงาน">หยุด</button>
  <button id="btnAuto" aria-label="โหมดอัตโนมัติ" aria-pressed="false">อัตโนมัติ: ปิด</button>
  <button id="btnMode" aria-label="เปลี่ยนโหมดการตรวจจับ">โหมดแม่นยำ</button>
  <button id="btnHelp" aria-label="ช่วยเหลือ ฟังวิธีใช้งาน">ช่วยเหลือ</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
