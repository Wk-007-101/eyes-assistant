<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ตาทิพย์ — ผู้ช่วยบอกสิ่งของรอบตัว</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* พื้นที่กล้อง แตะที่ไหนก็ได้เพื่อให้พูด */
  #tapArea {
    position: relative; flex: 1; min-height: 0;
    background: #111; overflow: hidden;
  }
  #cam, #overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  #overlay { pointer-events: none; }

  #hint {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 10px 14px; font-size: 15px;
    background: rgba(0,0,0,.55); text-align: center;
  }

  /* แถบสถานะ ตัวใหญ่ อ่านง่าย คอนทราสต์สูง */
  #status {
    padding: 14px 16px; font-size: 22px; line-height: 1.4;
    background: #ffe600; color: #000; font-weight: 700;
    min-height: 64px; display: flex; align-items: center;
  }

  #list {
    padding: 8px 16px; font-size: 16px; line-height: 1.6;
    background: #141414; max-height: 22vh; overflow-y: auto;
  }
  #list .row { padding: 3px 0; border-bottom: 1px solid #262626; }
  #list .sc { color: #9e9e9e; }

  /* ปุ่มใหญ่เต็มความกว้าง กดง่ายแม้มองไม่เห็น */
  #controls { display: flex; gap: 2px; background: #000; }
  button {
    flex: 1; padding: 24px 8px;
    font-size: 21px; font-weight: 700; font-family: inherit;
    color: #fff; background: #1565c0; border: none;
    cursor: pointer;
  }
  button:active { background: #0d47a1; }
  button:disabled { background: #555; }
  button.on { background: #2e7d32; }
</style>
</head>
<body>

<div id="tapArea">
  <video id="cam" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="hint">แตะที่หน้าจอเพื่อให้บอกสิ่งที่เห็น</div>
</div>

<div id="status">กดปุ่ม “เริ่มใช้งาน” ด้านล่างเพื่อเริ่ม</div>
<div id="list">ยังไม่พบสิ่งของ</div>

<div id="controls">
  <button id="btnStart">เริ่มใช้งาน</button>
  <button id="btnAuto">โหมดอัตโนมัติ: ปิด</button>
</div>

<!-- TensorFlow.js และโมเดล COCO-SSD โหลดจาก CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
